<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculadora IMC</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div th:replace="~{fragments/nav :: nav('calcular')}"></div>

<div class="page">
    <header class="page-header">
        <p class="eyebrow">Índice de Massa Corporal</p>
        <h1 class="page-title">Calcular IMC</h1>
        <p class="page-subtitle">Informe seus dados para obter o IMC, a classificação segundo a OMS e uma recomendação personalizada.</p>
    </header>

    <div class="card">
        <form action="/calcular" method="post">
            <div class="field">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Como podemos te chamar?" required>
            </div>

            <div class="field">
                <label for="peso">Peso</label>
                <input type="number" step="0.1" min="1" id="peso" name="peso" placeholder="Ex: 68.5" required>
                <span class="hint">Em quilogramas (kg)</span>
            </div>

            <div class="field">
                <label for="altura">Altura</label>
                <input type="number" step="0.01" min="0.5" max="2.5" id="altura" name="altura" placeholder="Ex: 1.72" required>
                <span class="hint">Em metros (m) — use ponto, ex: 1.72</span>
            </div>

            <button type="submit" class="btn">Calcular IMC</button>
        </form>
    </div>
</div>

</body>
</html>
